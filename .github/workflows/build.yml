name: Build whisper.cpp SYCL image

on:
  schedule:
    - cron: "17 6 * * 1"        # weekly, Monday ~2am Eastern; skips if tag already built
  workflow_dispatch:
    inputs:
      ref:
        description: "whisper.cpp tag/branch to build (blank = latest release tag)"
        required: false
        default: ""

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/whisper-sycl

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (oneAPI builds are big)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Resolve whisper.cpp ref
        id: ref
        run: |
          REF="${{ github.event.inputs.ref }}"
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/ggml-org/whisper.cpp 'v*' | head -1 | sed 's#.*refs/tags/##')
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building whisper.cpp @ $REF"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip scheduled run if this tag is already published
        id: exists
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             docker manifest inspect "$IMAGE:${{ steps.ref.outputs.ref }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already built, skipping."
          fi

      - name: Check out whisper.cpp
        if: steps.exists.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ steps.ref.outputs.ref }}
          path: whisper.cpp

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip != 'true'

      - name: Build (load locally first so we can sanity-check it)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: whisper.cpp
          file: whisper.cpp/.devops/main-intel.Dockerfile
          load: true
          tags: whisper-sycl:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sanity check - whisper-server must exist in the image
        if: steps.exists.outputs.skip != 'true'
        run: |
          docker run --rm --entrypoint sh whisper-sycl:test -c \
            'p=$(find / -name whisper-server -type f 2>/dev/null | head -1); [ -n "$p" ] && echo "whisper-server at: $p" || { echo "whisper-server NOT FOUND"; exit 1; }'

      - name: Push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: whisper.cpp
          file: whisper.cpp/.devops/main-intel.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ref.outputs.ref }}
          cache-from: type=gha
